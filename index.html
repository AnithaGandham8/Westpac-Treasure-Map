<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treasure Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <!-- ================= PHONE ================= -->
    <div class="phone" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🗺️</span>
          <div>
            <div class="brand-title">Treasure Map</div>
            <div class="brand-sub" id="hello">Hi Ana 👋</div>
          </div>
        </div>
        <button class="coin-counter" id="coin-counter" type="button" aria-label="Your coins">
          <span class="coin-ico" data-icon="coin"></span>
          <span id="coin-count">0</span>
        </button>
      </header>

      <!-- Card power-up switcher -->
      <div class="powerup" id="powerup" role="radiogroup" aria-label="Your card power-up"></div>

      <main class="screens">
        <!-- MAP -->
        <section class="screen is-active" id="screen-map" data-screen="map">
          <div class="map" id="map">
            <svg id="map-svg" preserveAspectRatio="none" aria-label="Map of the Gold Coast"></svg>
            <div class="map-labels" id="map-labels"></div>
            <div class="map-markers" id="map-markers"></div>
            <div class="map-chips" id="map-chips"></div>
            <div class="map-zoom">
              <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
              <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
            </div>
            <div class="map-legend">
              <span><i data-icon="chest"></i>Extras</span>
              <span><i data-icon="bag"></i>ShopBack</span>
              <span><i data-icon="gem"></i>Altitude</span>
            </div>
          </div>
        </section>

        <!-- DISCOVER (feed) -->
        <section class="screen" id="screen-discover" data-screen="discover">
          <div class="screen-pad">
            <!-- Phase 3 hooks the goal search into this input -->
            <label class="goal-search">
              <span aria-hidden="true">✨</span>
              <input id="goal-search" type="search" placeholder="Type your goal… e.g. Japan trip in June" autocomplete="off">
            </label>
            <div id="goal-result" aria-live="polite"></div>
            <div class="chips" id="category-chips"></div>
            <div id="feed"></div>
          </div>
        </section>

        <!-- POT -->
        <section class="screen" id="screen-pot" data-screen="pot">
          <div class="screen-pad" id="pot"></div>
        </section>

        <!-- MISSIONS: Me vs Me (Phase 4, drawn by missions.js) -->
        <section class="screen" id="screen-missions" data-screen="missions">
          <div class="screen-pad" id="missions-view"></div>
        </section>
      </main>

      <nav class="tabbar" aria-label="Main">
        <button type="button" class="tab is-active" data-tab="map"><span>🗺️</span>Map</button>
        <button type="button" class="tab" data-tab="discover"><span>🧭</span>Discover</button>
        <button type="button" class="tab" data-tab="pot"><span>🫙</span>Pot<i class="tab-dot" id="pot-dot"></i></button>
        <button type="button" class="tab" data-tab="missions"><span>🎯</span>Missions</button>
      </nav>

      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="fx-layer" id="fx" aria-hidden="true"></div>
    </div>

    <!-- ================= DEMO CONTROLS (outside the phone) ================= -->
    <aside class="demo">
      <div class="demo-title">Demo controls</div>
      <div id="scenario-switcher"></div>
      <p class="demo-note" id="scenario-note"></p>
      <button type="button" class="demo-reset" id="reset-demo">↺ Reset demo</button>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script src="missions.js"></script>
</body>
</html>
